name: Native installers - Windows, Linux and macOS
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified installers as a GitHub prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-installers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Windows-x86_64
          - os: ubuntu-22.04
            artifact: Linux-amd64
          - os: macos-14
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libnss3 libnspr4 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 libdbus-1-3 xdg-utils
      - name: Build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-copilot.txt
      - name: Backend and distribution checks
        run: |
          python -m unittest discover -s tests -p test_backend.py -v
          python -m unittest discover -s tests -p test_distribution.py -v
          npm run check
          npm test
      - name: Local visual packages
        run: python tools/setup_assets.py
      - name: Native C and C++ core
        run: python tools/build_native.py
      - name: Build native installer on its own OS
        run: python tools/build_desktop.py --require-assets --installer
      - name: Install and verify Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/LumenStudio-*-Linux-amd64.deb
          xvfb-run -a python tools/verify_native_package.py --bundle /opt/lumen-studio
      - name: Verify Windows and macOS package
        if: runner.os != 'Linux'
        run: python tools/verify_native_package.py
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: LumenStudio-${{ matrix.artifact }}
          path: dist/LumenStudio-*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: |
            dist/*verification.json
            build/**/warn-*.txt
          if-no-files-found: ignore
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: LumenStudio-*
          path: release-assets
          merge-multiple: true
      - name: Publish all four verified native builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_native_release.py --directory release-assets
