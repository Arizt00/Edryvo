name: Native desktop artifacts (unsigned)
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Private build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify backend
        run: python -m unittest discover -s tests -p test_backend.py -v
      - name: Local visual packages
        run: python tools/setup_assets.py
      - name: Build bundle on its own operating system
        run: python tools/build_desktop.py --require-assets
      - uses: actions/upload-artifact@v4
        with:
          name: LumenStudio-unsigned-${{ matrix.os }}
          path: dist/
          retention-days: 7
# No automatic publishing, signing keys, notarization or cloud API credentials.
